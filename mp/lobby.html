<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNAF 1 Multijugador — Lobby</title>
    <link rel="icon" href="../1/favicon.ico" />
    <style>
        html {
            display: block;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            background-color: black;
            background-image: url(../1/resources/office.png);
            background-position: center;
            background-size: cover;
            margin: 0;
            height: 100%;
            font-family: monospace;
            color: #cfcfcf;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .glitch {
            position: absolute;
            background-image: url(../1/resources/background.gif);
            background-position: center;
            background-size: 50vw;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0.55;
            z-index: 0;
        }

        #title {
            position: absolute;
            top: 4vh;
            left: 5vw;
            z-index: 1;
            height: 13vh;
        }

        .panel {
            position: absolute;
            top: 19vh;
            left: 50%;
            transform: translate(-50%, 0);
            z-index: 2;
            width: min(64vw, 720px);
            max-height: 74vh;
            text-align: center;
        }

        .btn {
            font-family: monospace;
            font-weight: bold;
            font-size: 2.1vw;
            color: #cfcfcf;
            background: transparent;
            border: none;
            cursor: pointer;
            letter-spacing: 0.15vw;
            text-shadow: 0 0 0.6vw rgba(255, 255, 255, 0.25);
            transition: color 0.08s linear;
            padding: 0.6vh 0;
        }

        .btn:hover {
            color: #fff;
            text-shadow: 0 0 1vw rgba(255, 255, 255, 0.8);
        }

        .btn:disabled {
            color: #565656;
            text-shadow: none;
            cursor: default;
        }

        .btn.small {
            font-size: 1.5vw;
        }

        input.code {
            font-family: monospace;
            font-size: 2.6vw;
            letter-spacing: 0.7vw;
            text-transform: uppercase;
            text-align: center;
            background: rgba(0, 0, 0, 0.65);
            color: #ffd34d;
            border: 0.15vw solid #3a3a3a;
            padding: 0.8vh 1vw;
            width: 22vw;
            outline: none;
        }

        input.code:focus {
            border-color: #ffd34d;
        }

        .status {
            font-size: 1.35vw;
            color: #9a9a9a;
            margin: 1.4vh 0;
            min-height: 2.4vh;
        }

        .roomcode {
            font-size: 3.4vw;
            letter-spacing: 1vw;
            color: #ffd34d;
            text-shadow: 0 0 1.4vw rgba(255, 211, 77, 0.5);
            margin: 0.6vh 0 1.6vh 0;
        }

        /* ---- lista de jugadores ---- */
        .plist {
            display: flex;
            flex-direction: column;
            gap: 0.7vh;
            margin: 1.6vh auto 1.4vh auto;
            max-width: 34vw;
        }

        .prow {
            display: flex;
            align-items: center;
            gap: 1vw;
            background: rgba(0, 0, 0, 0.55);
            border: 0.12vw solid #2c2c2c;
            padding: 0.5vh 1vw;
        }

        .prow.me { border-color: #ffd34d; box-shadow: 0 0 0.8vw rgba(255, 211, 77, 0.25); }

        .prow .pic { width: 2.6vw; height: 2.6vw; min-width: 26px; min-height: 26px; object-fit: contain; }
        .prow .pname { font-weight: bold; font-size: 1.25vw; letter-spacing: 0.08vw; flex: 1; text-align: left; }
        .prow .ptag { font-size: 0.95vw; color: #8f8f8f; letter-spacing: 0.15vw; }

        /* ---- mi rol asignado ---- */
        .myrole {
            margin: 1.2vh auto 1.8vh auto;
            border: 0.16vw solid #3a3a3a;
            background: rgba(0, 0, 0, 0.6);
            padding: 1.2vh 2vw 1.6vh 2vw;
            max-width: 40vw;
        }

        .myrole .mrlabel { font-size: 0.95vw; color: #8f8f8f; letter-spacing: 0.35vw; margin-bottom: 0.8vh; }
        .myrole .mrpic { height: 10vh; object-fit: contain; margin-bottom: 0.6vh; }
        .myrole .mrname { display: inline-block; font-size: 1.7vw; font-weight: bold; letter-spacing: 0.25vw; border-bottom: 0.2vw solid; padding: 0 0.6vw 0.4vh 0.6vw; }
        .myrole .mrdesc { font-size: 1vw; color: #9a9a9a; margin-top: 1vh; line-height: 1.6; }

        .players {
            font-size: 1.1vw;
            color: #8f8f8f;
            margin-bottom: 1.6vh;
            line-height: 1.6;
        }

        .note {
            font-size: 1vw;
            color: #7d7d7d;
            max-width: 46vw;
            margin: 0 auto;
            line-height: 1.6;
        }

        .hidden { display: none !important; }

        .err { color: #ff5d5d; }

        /* ---- chip de cuenta axc (SSO) ---- */
        #accountChip {
            position: absolute;
            top: 2.2vh;
            right: 2vw;
            z-index: 30;
            /* por encima de glitch(0)/panel(2)/viñeta(5),
               por debajo del modal de cuenta axc (z-index 1000) */
        }
    </style>
</head>

<body>
    <img id="title" src="../1/resources/title.png">
    <!-- Sistema de cuentas axc (SSO): botón Iniciar sesión / avatar -->
    <div id="accountChip"></div>
    <div class="panel">

        <!-- pantalla inicial -->
        <div id="scr-home">
            <button class="btn" id="b-create">&gt; CREAR PARTIDA</button><br>
            <div class="status">— o —</div>
            <input class="code" id="in-code" maxlength="5" placeholder="CÓDIGO">
            <br><br>
            <button class="btn" id="b-join">&gt; UNIRSE A PARTIDA</button>
            <div class="status" id="home-status">Se necesita CUENTA axc para jugar: tu usuario será tu nombre. Roles ALEATORIOS para todos; el GUARDIA se sortea al EMPEZAR.</div>
        </div>

        <!-- sala de espera -->
        <div id="scr-room" class="hidden">
            <div class="status" id="room-label"></div>
            <div class="roomcode" id="room-code"></div>
            <div class="myrole hidden" id="myrole"></div>
            <div class="plist" id="plist"></div>
            <div class="status" id="room-status">Esperando jugadores...</div>
            <button class="btn hidden" id="b-start">&gt; EMPEZAR NOCHE (SORTEAR GUARDIA)</button><br>
            <button class="btn small" id="b-leave">&gt; salir</button>
        </div>

    </div>
    <div class="glitch"></div>
    <img src="../1/resources/vignette.png" class="vignette">
    <!-- PeerJS con CDNs de respaldo: si unpkg falla, prueba jsdelivr -->
    <script>
        (function () {
            var CDNS = [
                'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
                'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'
            ];
            function load(i) {
                if (i >= CDNS.length) return; // lobby.js mostrará el error al usuario
                var s = document.createElement('script');
                s.src = CDNS[i];
                s.onerror = function () { load(i + 1); };
                document.head.appendChild(s);
            }
            load(0);
        })();
    </script>
    <!-- Sistema de cuentas axc (SSO): una sola cuenta para todas las páginas de axcStudios -->
    <script src="https://axcgamestudios.github.io/axcStudios/axc-auth.js"></script>
    <script src="https://axcgamestudios.github.io/axcStudios/axc-ui.js"></script>
    <script src="net.js"></script>
    <script src="lobby.js"></script>
</body>

</html>
