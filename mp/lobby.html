<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNAF 1 Multijugador — Lobby</title>
    <link rel="icon" href="../1/favicon.ico" />
    <style>
        html {
            display: block;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            background-color: black;
            background-image: url(../1/resources/office.png);
            background-position: center;
            background-size: cover;
            margin: 0;
            height: 100%;
            font-family: monospace;
            color: #cfcfcf;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .glitch {
            position: absolute;
            background-image: url(../1/resources/background.gif);
            background-position: center;
            background-size: 50vw;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0.55;
            z-index: 0;
        }

        #title {
            position: absolute;
            top: 4vh;
            left: 5vw;
            z-index: 1;
            height: 13vh;
        }

        .panel {
            position: absolute;
            top: 19vh;
            left: 50%;
            transform: translate(-50%, 0);
            z-index: 2;
            width: min(64vw, 720px);
            max-height: 74vh;
            text-align: center;
        }

        .btn {
            font-family: monospace;
            font-weight: bold;
            font-size: 2.1vw;
            color: #cfcfcf;
            background: transparent;
            border: none;
            cursor: pointer;
            letter-spacing: 0.15vw;
            text-shadow: 0 0 0.6vw rgba(255, 255, 255, 0.25);
            transition: color 0.08s linear;
            padding: 0.6vh 0;
        }

        .btn:hover {
            color: #fff;
            text-shadow: 0 0 1vw rgba(255, 255, 255, 0.8);
        }

        .btn:disabled {
            color: #565656;
            text-shadow: none;
            cursor: default;
        }

        .btn.small {
            font-size: 1.5vw;
        }

        input.code {
            font-family: monospace;
            font-size: 2.6vw;
            letter-spacing: 0.7vw;
            text-transform: uppercase;
            text-align: center;
            background: rgba(0, 0, 0, 0.65);
            color: #ffd34d;
            border: 0.15vw solid #3a3a3a;
            padding: 0.8vh 1vw;
            width: 22vw;
            outline: none;
        }

        input.code:focus {
            border-color: #ffd34d;
        }

        .status {
            font-size: 1.35vw;
            color: #9a9a9a;
            margin: 1.4vh 0;
            min-height: 2.4vh;
        }

        .roomcode {
            font-size: 3.4vw;
            letter-spacing: 1vw;
            color: #ffd34d;
            text-shadow: 0 0 1.4vw rgba(255, 211, 77, 0.5);
            margin: 0.6vh 0 1.6vh 0;
        }

        .roles {
            display: flex;
            justify-content: center;
            gap: 1.6vw;
            margin: 1.8vh 0 2.4vh 0;
            flex-wrap: wrap;
        }

        .role {
            border: 0.18vw solid #3a3a3a;
            background: rgba(0, 0, 0, 0.6);
            padding: 1.2vh 1vw;
            width: 9.5vw;
            min-width: 105px;
            cursor: pointer;
            transition: border-color 0.1s, box-shadow 0.1s;
            position: relative;
        }

        .role:hover {
            border-color: #9c9c9c;
        }

        .role.locked {
            cursor: default;
            opacity: 0.92;
        }

        .role .rname {
            font-weight: bold;
            font-size: 1.35vw;
            letter-spacing: 0.08vw;
        }

        .role .rwho {
            font-size: 0.95vw;
            color: #ffd34d;
            margin-top: 0.6vh;
            min-height: 1.1vh;
            word-break: break-word;
        }

        .role .rpic {
            width: 100%;
            height: 9vh;
            object-fit: contain;
            margin-bottom: 0.6vh;
            filter: brightness(0.9);
        }

        .role.g { border-color: #6d6d6d; }
        .role.selected { border-color: #ffd34d; box-shadow: 0 0 1vw rgba(255, 211, 77, 0.35); }

        .players {
            font-size: 1.1vw;
            color: #8f8f8f;
            margin-bottom: 1.6vh;
            line-height: 1.6;
        }

        .note {
            font-size: 1vw;
            color: #7d7d7d;
            max-width: 46vw;
            margin: 0 auto;
            line-height: 1.6;
        }

        .hidden { display: none !important; }

        .err { color: #ff5d5d; }
    </style>
</head>

<body>
    <img id="title" src="../1/resources/title.png">
    <div class="panel">

        <!-- pantalla inicial -->
        <div id="scr-home">
            <button class="btn" id="b-create">&gt; CREAR PARTIDA</button><br>
            <div class="status">— o —</div>
            <input class="code" id="in-code" maxlength="5" placeholder="CÓDIGO">
            <br><br>
            <button class="btn" id="b-join">&gt; UNIRSE A PARTIDA</button>
            <div class="status" id="home-status">El creador de la partida será el GUARDIA.</div>
        </div>

        <!-- sala de espera -->
        <div id="scr-room" class="hidden">
            <div class="status" id="room-label"></div>
            <div class="roomcode" id="room-code"></div>
            <div class="roles" id="roles"></div>
            <div class="players" id="players"></div>
            <div class="status" id="room-status">Esperando jugadores...</div>
            <button class="btn hidden" id="b-start">&gt; EMPEZAR NOCHE</button><br>
            <button class="btn small" id="b-leave">&gt; salir</button>
        </div>

    </div>
    <div class="glitch"></div>
    <img src="../1/resources/vignette.png" class="vignette">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="net.js"></script>
    <script src="lobby.js"></script>
</body>

</html>
