<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's 1 — Multijugador</title>
    <link rel="icon" href="1/favicon.ico" />
    <style>
        html {
            display: block;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            background-color: black;
            background-image: url(1/resources/office.png);
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100%;
            font-family: monospace;
        }

        a {
            text-decoration: none;
        }

        .selection {
            height: auto;
            min-height: 100vh;
            width: 100%;
            display: flex;
            overflow: hidden;
        }

        .launcher-text {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 2.5vh;
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        .glitch {
            position: absolute;
            background-image: url(1/resources/background.gif);
            background-position: center;
            background-size: 50vw;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0.75;
            z-index: -1;
        }

        #title {
            position: absolute;
            top: 10vh;
            left: 5vw;
            z-index: 1;
            height: 20vh;
        }

        #animatronic {
            position: absolute;
            top: -5vh;
            right: 7vw;
            height: 120vh;
        }

        .menu {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 14vh;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.2vh;
            width: 85vw;
        }

        .btn {
            font-family: monospace;
            font-weight: bold;
            font-size: 2.6vw;
            color: #cfcfcf;
            background: transparent;
            border: none;
            cursor: pointer;
            letter-spacing: 0.15vw;
            text-shadow: 0 0 0.6vw rgba(255, 255, 255, 0.25);
            transition: color 0.08s linear, text-shadow 0.08s linear;
        }

        .btn:hover {
            color: #ffffff;
            text-shadow: 0 0 1vw rgba(255, 255, 255, 0.8);
        }

        .btn.small {
            font-size: 1.4vw;
            color: #8a8a8a;
        }

        .note {
            color: #7d7d7d;
            font-size: 1.1vw;
            font-family: monospace;
            text-align: center;
            max-width: 46vw;
            line-height: 1.7;
            margin-top: 1vh;
        }

        .new {
            color: #ffd34d;
            font-size: 0.95vw;
            letter-spacing: 0.3vw;
            vertical-align: super;
        }

        /* ---- chip de cuenta axc (SSO) ---- */
        #accountChip {
            position: absolute;
            top: 2.5vh;
            right: 2vw;
            z-index: 30;
            /* sobre el menú(2) y la viñeta, bajo el modal axc (z-index 1000) */
        }
    </style>
</head>

<body>
    <div class="selection" id="selection">
        <img id="title" src="1/resources/title.png">
        <img id="animatronic" src="1/resources/animatronic.png">
        <div class="menu">
            <a href="1/index.html"><button class="btn">&gt; JUGAR SOLO</button></a>
            <a href="mp/lobby.html"><button class="btn">&gt; MULTIJUGADOR <span class="new">NUEVO</span></button></a>
            <div class="note">Necesitas una CUENTA axc gratuita para jugar (sirve en todas
                las páginas de axcStudios; en multijugador tu usuario es tu nombre).
                MULTIJUGADOR: crea una partida y el GUARDIA se sortea al EMPEZAR;
                los animatrónicos se mueven en primera persona por la pizzería.
                Pulsa <b>-=</b> para pantalla completa.</div>
        </div>
        <a href="https://discord.gg/xuu8TnSY4b">
            <div class="launcher-text"><img src="1/resources/launcher-text.png" style="width: 45vw;"></div>
        </a>
        <!-- Sistema de cuentas axc (SSO): botón Iniciar sesión / avatar -->
        <div id="accountChip"></div>
    </div>
    <div class="glitch"></div>
    <img src="1/resources/vignette.png" class="vignette">
    <!-- Sistema de cuentas axc (SSO): una sola cuenta para todas las páginas de axcStudios -->
    <script src="https://axcgamestudios.github.io/axcStudios/axc-auth.js"></script>
    <script src="https://axcgamestudios.github.io/axcStudios/axc-ui.js"></script>
    <script>
        // Evita el movimiento táctil (como el original)
        window.addEventListener("scroll", preventMotion, false);
        window.addEventListener("touchmove", preventMotion, false);
        function preventMotion(event) {
            window.scrollTo(0, 0);
            event.preventDefault();
            event.stopPropagation();
        }
        // Pantalla completa con -=
        const pressedKeys = {};
        document.addEventListener('keydown', event => {
            pressedKeys[event.key] = true;
            if (pressedKeys['-'] && pressedKeys['=']) {
                document.documentElement.requestFullscreen();
                delete pressedKeys[event.key];
            }
        });
        document.addEventListener('keyup', (event) => {
            delete pressedKeys[event.key];
        });

        // ---- Sistema de cuentas axc (SSO) ----
        // JUGAR (solo o multijugador) exige sesión; el modal de cuenta
        // se abre al pulsar y la acción continúa sola al iniciar sesión.
        // Degradación suave: si la biblioteca o el servidor de cuentas
        // no están disponibles, se juega igual (con aviso).
        (function () {
            let pending = null;   // destino en espera de sesión

            function libsOk() { return !!(window.AXC && window.AXC_UI); }
            function serverDown() {
                try { return !!(window.AXC && AXC.state.db === false); } catch (e) { return false; }
            }

            function gate(href) {
                return function (ev) {
                    ev.preventDefault();
                    if (!libsOk()) { window.location.href = href; return; }        // CDN caído → no bloquear
                    if (AXC.state.user) { window.location.href = href; return; }   // con sesión → jugar
                    if (serverDown()) {                                            // servidor caído → avisar y jugar
                        try { AXC_UI.toast('Servidor de cuentas no disponible: jugando sin cuenta'); } catch (e) { }
                        window.location.href = href; return;
                    }
                    pending = href;
                    AXC_UI.openAuth('login');
                };
            }

            const links = document.querySelectorAll('.menu a');
            for (let i = 0; i < links.length; i++) {
                links[i].addEventListener('click', gate(links[i].getAttribute('href')));
            }

            if (libsOk()) {
                try {
                    AXC_UI.init({
                        chip: '#accountChip',
                        onAuth: function (u) {
                            if (u && pending) {
                                try { AXC_UI.closeAuth(); } catch (e) { }
                                const h = pending; pending = null;
                                window.location.href = h;               // continuar lo pulsado
                            }
                        }
                    });
                } catch (e) { }
            }
        })();
    </script>
</body>

</html>
